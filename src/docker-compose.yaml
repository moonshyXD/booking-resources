services:
  postgres:
    image: postgres:13.3
    container_name: postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 4G

  redis:
    image: redis:latest
    container_name: redis
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - REDIS_USER=${REDIS_USER}
      - REDIS_USER_PASSWORD=${REDIS_USER_PASSWORD}
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/var/lib/redis/data
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
    command: >
      sh -c '
        mkdir -p /usr/local/etc/redis &&
        echo "bind 0.0.0.0" > /usr/local/etc/redis/redis.conf &&
        echo "requirepass $$REDIS_PASSWORD" >> /usr/local/etc/redis/redis.conf &&
        echo "appendonly yes" >> /usr/local/etc/redis/redis.conf &&
        echo "appendfsync everysec" >> /usr/local/etc/redis/redis.conf &&
        echo "user default on nopass ~* +@all" > /usr/local/etc/redis/users.acl &&
        echo "user $$REDIS_USER on >$$REDIS_USER_PASSWORD ~* +@all" >> /usr/local/etc/redis/users.acl &&
        redis-server /usr/local/etc/redis/redis.conf --aclfile /usr/local/etc/redis/users.acl
      '
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "$REDIS_PASSWORD", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  iam:
    container_name: iam
    build:
      context: ./backend
      dockerfile: ./iam/Dockerfile
    ports:
      - "8006:8012"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - PYTHONPATH=/usr/app/backend
      - API_URL_IAM=${API_URL_IAM}

  catalog:
    container_name: catalog
    build:
      context: ./backend
      dockerfile: ./catalog/Dockerfile
    ports:
      - "8007:8013"
    depends_on:
      postgres:
        condition: service_started
      redis:
        condition: service_started
    environment:
      - PYTHONPATH=/usr/app/backend
      - API_URL_CATALOG=${API_URL_CATALOG}

  booking:
    container_name: booking
    build:
      context: ./backend
      dockerfile: ./booking/Dockerfile
    ports:
      - "8008:8014"
    depends_on:
      postgres:
        condition: service_started
      redis:
        condition: service_started
    environment:
      - PYTHONPATH=/usr/app/backend
      - API_URL_BOOKING=${API_URL_BOOKING}

  notifications:
    container_name: notifications
    build:
      context: ./backend
      dockerfile: ./notifications/Dockerfile
    ports:
      - "8010:8011"
    depends_on:
      iam:
        condition: service_started
      catalog:
        condition: service_started
      booking:
        condition: service_started
    environment:
      - PYTHONPATH=/usr/app/backend
      - API_URL_NOTIFICATIONS=${API_URL_NOTIFICATIONS}

  frontend:
    container_name: frontend
    build:
      context: ./frontend
      dockerfile: ./Dockerfile
    ports:
      - "8001:5173"
    depends_on:
      - notifications
    environment:
      - API_URL_FRONTEND=${API_URL_FRONTEND}

  caddy:
    container_name: caddy
    build:
      context: ..
      dockerfile: Dockerfile
    ports:
      - "80:80"
    depends_on:
      frontend:
        condition: service_started
      iam:
        condition: service_started
      notifications:
        condition: service_started
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
